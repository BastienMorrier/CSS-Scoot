<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoot</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container-left">
            <img src="img/scoot.svg" alt="Logo">
            <ul>
                <li><a href="about/index.html">About</a></li>
                <li><a href="#">Location</a></li>
                <li><a href="#">Careers</a></li>
            </ul>
        </div>

        <div class="button">
            <a href="#">Get Scootin</a>
        </div>
    </header>
    <main>

    </main>
    <footer>
        <div class="espace">
            <div class="signUp">
                <p class="titleFooter">Sign up and Scoot off today</p>
                <div class="cardRight">
                    <div class="cardApple">
                        <img src="img/apple.png" alt="apple">
                        <div class="txt-apple">
                            <p class="available-apple">Available on the</p>
                            <p class="AppStore">AppStore</p>
                        </div>
                    </div>
                    <div class="googlePlay">
                        <img src="img/playstore.png" alt="GooglePlay">
                        <div class="txt-googlePlay">
                            <p class="available-googlePlay">Get it on</p>
                            <p class="googlePlayTxt">GooglePlay</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="navbar-bottom">
            <div class="navbar-bottom-margin">
                <img src="img/scoot-white.png" alt="Logo">
                <ul>
                    <li><a href="about/index.html">About</a></li>
                    <li><a href="#">Location</a></li>
                    <li><a href="#">Careers</a></li>
                </ul>
    
                <div class="social-network">
                    <img src="img/facebook.png" alt="facebook">
                    <img src="img/twitter.png" alt="twitter">
                    <img src="img/instagram.png" alt="instagram">
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
